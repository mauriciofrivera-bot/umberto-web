<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Journal | Umberto Campioni</title>
    
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

    <style>
        :root {
            --dorado: #b58d52;
            --oscuro: #0a0a0a;
            --blanco: #f0f0f0;
            --gris-texto: #d1d1d1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            background-color: var(--oscuro); 
            color: var(--blanco); 
            font-family: 'EB Garamond', serif; 
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        nav { 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            gap: 25px; 
            border-bottom: 1px solid #1a1a1a; 
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.95);
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        nav a { color: var(--blanco); text-decoration: none; text-transform: uppercase; font-size: 1.1rem; letter-spacing: 2px; }

        .post-container {
            max-width: 780px; 
            margin: 60px auto;
            padding: 0 30px;
            position: relative;
        }

        .post-header {
            text-align: center;
            margin-bottom: 60px;
            padding: 50px 20px;
            border: 2px solid var(--dorado); 
            position: relative;
        }

        .post-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 8vw, 3.2rem);
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1.2;
            font-weight: 700; 
            color: var(--dorado); 
            margin: 0;
        }

        #img-wrapper {
            width: 100%;
            margin: 40px 0 60px 0;
            display: none;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            border: 1px solid var(--dorado);
            transition: all 0.8s ease;
        }

        #post-image {
            width: 100%;
            height: auto;
            display: block;
            filter: contrast(110%);
        }

        .post-content { font-size: 1.3rem; color: var(--gris-texto); text-align: justify; }

        .post-content > p:first-of-type::first-letter {
            float: left;
            font-family: 'Playfair Display', serif;
            font-size: 5.5rem;
            line-height: 0.7;
            padding-right: 15px;
            padding-top: 12px;
            color: var(--dorado);
            font-weight: 700;
        }

        .post-content strong, .post-content b {
            color: var(--dorado);
            font-weight: 700;
        }

        .post-content ul { list-style: none; margin: 30px 0; padding-left: 10px; }
        .post-content li { position: relative; margin-bottom: 18px; padding-left: 35px; }
        .post-content li::before {
            content: "◆"; 
            position: absolute;
            left: 0;
            color: var(--dorado);
            font-size: 0.9rem;
            font-weight: 700;
            top: 2px;
        }

        .post-content h2, .post-content h3 {
            font-family: 'Playfair Display', serif;
            color: var(--dorado);
            font-weight: 700;
            text-transform: uppercase;
            margin: 40px 0 20px 0;
        }

        blockquote {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.7rem;
            color: var(--dorado);
            font-weight: 700;
            margin: 50px 0;
            text-align: center;
            border: none;
        }

        /* --- SECCIÓN DE COMENTARIOS --- */
        .comments-section {
            margin-top: 60px; 
            padding: 40px 30px; 
            border: 1px solid rgba(181, 141, 82, 0.3); 
            background-color: #121212; 
        }

        .comments-section h3, .comments-section h4 {
            font-family: 'Playfair Display', serif; 
            color: var(--dorado); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: #888; 
            margin-bottom: 8px;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%; 
            background: transparent; 
            border: none; 
            border-bottom: 1px solid #333; 
            color: #fff; 
            padding: 10px 0; 
            font-family: 'EB Garamond', serif; 
            font-size: 1.1rem; 
            outline: none;
            transition: border-bottom-color 0.3s ease;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-bottom-color: var(--dorado);
        }

        .btn-submit {
            background: transparent; 
            border: 1px solid var(--dorado); 
            color: var(--dorado); 
            padding: 12px 30px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background: var(--dorado);
            color: var(--oscuro);
        }

        @media (max-width: 600px) {
            .post-container { margin: 30px auto; padding: 0 20px; }
            .post-content { font-size: 1.15rem; text-align: left; }
            .post-content > p:first-of-type::first-letter { font-size: 4rem; }
            .comments-section { margin-top: 40px; padding: 25px 20px; }
        }

        footer { text-align: center; padding: 80px 20px; color: #444; font-size: 0.7rem; letter-spacing: 2px; }

        .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 10px; 
            color: var(--blanco, #f0f0f0); 
            text-decoration: none;
            text-transform: uppercase;
            font-family: 'EB Garamond', serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .instagram-link i { font-size: 1.3rem; }
        .instagram-link:hover { color: #b58d52; transform: translateY(-2px); }
    </style>
</head>
<body>

    <!-- Formulario invisible para detección de Netlify -->
    <form name="post-comments" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="post_id" />
      <textarea name="comment"></textarea>
    </form>

    <nav>
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <article class="post-container">
        <header class="post-header">
            <span id="post-category" style="display: none;"></span>
            <h1 id="post-title">...</h1>
        </header>

        <div id="img-wrapper">
            <img id="post-image" src="" alt="">
        </div>

        <div id="post-content" class="post-content"></div>

        <!-- Lista de Comentarios Existentes -->
        <div id="comments-display" style="margin-top: 60px;">
            <h4 style="font-size: 1.3rem; border-bottom: 1px solid var(--dorado); padding-bottom: 10px;">
                Comments
            </h4>
            <div id="comments-list" style="margin-top: 20px;">
                <p style="color: #888; font-style: italic;">Loading comments...</p>
            </div>
        </div>

        <!-- Formulario de Nuevo Comentario -->
        <section class="comments-section">
            <h3>Leave a Comment</h3>

            <form id="comment-form">
                <input type="hidden" id="post-id-input" name="post_id" value="">

                <div class="form-group">
                    <label for="comment-name">Name</label>
                    <input type="text" id="comment-name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="comment-text">Comment</label>
                    <textarea id="comment-text" name="comment" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn-submit">Submit Comment</button>
            </form>
        </section>
    </article>

    <footer>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

        <a href="https://instagram.com/umberto_campioni" class="instagram-link" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-instagram"></i>
            <span>Umberto_Campioni</span>
        </a>

        <span style="color: var(--blanco, #f0f0f0); margin: 0 10px;">|</span>

        <a href="https://www.instagram.com/fashion___gourmet" class="instagram-link" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-instagram"></i>
            <span>Fashion__Gourmet</span>
        </a>

        <p style="margin-top: 40px;">&copy; 2026 UMBERTO CAMPIONI.</p>
    </footer>

    <script>
        const USER = 'mauriciofrivera-bot';
        const REPO = 'umberto-web';

        // CONFIGURACIÓN DE LA API DE NETLIFY (Reemplaza con tus datos real)
        const NETLIFY_TOKEN = 'nfp_6BC8FxxcZRNweSA3ey3bUU1UBx3Rdpndf334'; 
        const FORM_ID = '6a708e43a15443000898d03b'; 

        async function fetchComments(fileName) {
            const listContainer = document.getElementById('comments-list');

            if (NETLIFY_TOKEN === 'TU_PERSONAL_ACCESS_TOKEN' || FORM_ID === 'TU_FORM_ID') {
                listContainer.innerHTML = '<p style="color: #666; font-style: italic;">Please configure your NETLIFY_TOKEN and FORM_ID in the script.</p>';
                return;
            }

            try {
                const res = await fetch(`https://api.netlify.com/api/v1/forms/${FORM_ID}/submissions?access_token=${NETLIFY_TOKEN}`);
                if (!res.ok) throw new Error('Error fetching comments');
                
                const submissions = await res.json();
                
                // Filtrar comentarios únicos del post actual usando fileName
                const postComments = submissions.filter(sub => sub.data && sub.data.post_id === fileName);

                if (postComments.length === 0) {
                    listContainer.innerHTML = '<p style="color: #666; font-style: italic;">No comments yet. Be the first to leave one!</p>';
                    return;
                }

                // Renderizar comentarios en pantalla
                listContainer.innerHTML = postComments.map(c => `
                    <div style="border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px 0; margin-bottom: 15px;">
                        <strong style="color: var(--dorado); font-size: 1.1rem; display: block;">${escapeHtml(c.data.name)}</strong>
                        <p style="color: #ccc; margin-top: 5px; font-size: 1.05rem;">${escapeHtml(c.data.comment)}</p>
                        <span style="color: #555; font-size: 0.75rem;">${new Date(c.created_at).toLocaleDateString()}</span>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                listContainer.innerHTML = '<p style="color: #666;">Unable to load comments at this time.</p>';
            }
        }

        // Función para evitar la inyección de código malicioso en comentarios HTML
        function escapeHtml(str) {
            return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        async function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const fileName = params.get('article');
            
            if (!fileName) {
                document.getElementById('post-title').innerText = "Post not found";
                return;
            }

            const postIdInput = document.getElementById('post-id-input');
            if (postIdInput) postIdInput.value = fileName;

            // Cargar comentarios desde Netlify
            fetchComments(fileName);

            const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/_posts/${fileName}`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("No se pudo obtener el post");
                
                const buffer = await res.arrayBuffer();
                const decoder = new TextDecoder('utf-8');
                const text = decoder.decode(buffer);
                
                const parts = text.split('---');
                if (parts.length >= 3) {
                    const meta = jsyaml.load(parts[1]);
                    document.getElementById('post-title').innerText = meta.title;

                    if (meta.thumbnail) {
                        const img = document.getElementById('post-image');
                        const wrapper = document.getElementById('img-wrapper');
                        const fileNameOnly = meta.thumbnail.split('/').pop();
                        img.src = `images/blog/${fileNameOnly}`;
                        wrapper.style.display = 'block';
                        img.onerror = () => img.src = `https://raw.githubusercontent.com/${USER}/${REPO}/main/images/blog/${fileNameOnly}`;
                    }

                    document.getElementById('post-content').innerHTML = marked.parse(parts.slice(2).join('---'));
                }
            } catch (err) { 
                console.error(err); 
                document.getElementById('post-title').innerText = "Post not found";
            }
        }

        // Manejar el envío del formulario mediante AJAX y recargar los comentarios de inmediato
        document.addEventListener("DOMContentLoaded", () => {
            const commentForm = document.getElementById('comment-form');
            if (commentForm) {
                commentForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const currentFileName = document.getElementById('post-id-input').value;
                    const formData = new URLSearchParams();
                    formData.append('form-name', 'post-comments');
                    formData.append('post_id', currentFileName);
                    formData.append('name', document.getElementById('comment-name').value);
                    formData.append('comment', document.getElementById('comment-text').value);

                    try {
                        const response = await fetch('/', {
                            method: 'POST',
                            headers: { "Content-Type": "application/x-www-form-urlencoded" },
                            body: formData.toString()
                        });

                        if (response.ok) {
                            alert('Thank you! Your comment has been submitted.');
                            commentForm.reset();
                            // Refrescar lista de comentarios sin recargar la página completa
                            fetchComments(currentFileName);
                        } else {
                            alert('Error submitting comment. Please try again.');
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        alert('Connection error. Please try again later.');
                    }
                });
            }
        });

        window.onload = loadPost;
    </script>
</body>
</html>
